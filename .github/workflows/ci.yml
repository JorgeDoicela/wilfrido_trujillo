name: Integración Continua (CI - Pull Requests)

on:
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configurar Node.js 22 LTS con caché de pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias del monorepo
        run: pnpm install --frozen-lockfile

      - name: Análisis estático de código (Oxlint)
        run: pnpm -r run lint

      - name: Ejecutar pruebas unitarias (Vitest)
        run: pnpm --filter backend run test

      - name: Compilar paquetes para producción
        run: pnpm -r run build
        env:
          VITE_API_URL: /api

      - name: Empaquetar artefacto Backend (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

      - name: Empaquetar artefacto Frontend (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
