name: CI/CD Pipeline (Build en GitHub & Despliegue en Debian)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, Test & Build en Servidores de GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configurar Node.js 22 LTS con caché
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias del monorepo
        run: pnpm install --frozen-lockfile

      - name: Análisis estático de código (Oxlint)
        run: pnpm -r run lint

      - name: Ejecutar pruebas unitarias (Vitest)
        run: pnpm --filter backend run test

      - name: Compilar monorepo para producción (Zero RAM en el VPS)
        run: pnpm -r run build
        env:
          VITE_API_URL: /api

      - name: Guardar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            backend/dist/
            frontend/dist/
            backend/package.json
            frontend/package.json
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          retention-days: 7

  deploy:
    name: Despliegue Automatizado a VPS Debian
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validar disponibilidad de credenciales VPS
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USERNAME }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secretos VPS (VPS_HOST, VPS_USERNAME o VPS_SSH_KEY) no detectados en GitHub Secrets. Se omite el despliegue por SSH hasta configurar el servidor."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            SSH_PORT="${{ secrets.VPS_SSH_PORT }}"
            echo "ssh_port=${SSH_PORT:-22}" >> "$GITHUB_OUTPUT"
            echo "Credenciales completas detectadas. Procediendo con el despliegue por SSH..."
          fi

      - name: Descargar artefactos compilados desde GitHub
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: Preparar directorio destino en el VPS vía SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.check_secrets.outputs.ssh_port }}
          script: |
            sudo mkdir -p /var/www/wilfrido_trujillo
            sudo chown -R $(whoami):$(whoami) /var/www/wilfrido_trujillo
            sudo chmod -R 775 /var/www/wilfrido_trujillo

      - name: Desplegar artefactos al servidor VPS vía SCP
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.check_secrets.outputs.ssh_port }}
          source: "backend/dist/,frontend/dist/,backend/package.json,frontend/package.json,package.json,pnpm-lock.yaml,pnpm-workspace.yaml"
          target: "/var/www/wilfrido_trujillo/"
          overwrite: true

      - name: Configurar Nginx, Systemd y reiniciar servicios en el VPS vía SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.check_secrets.outputs.ssh_port }}
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/share/pnpm
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            cd /var/www/wilfrido_trujillo

            # 1. Instalar dependencias de producción
            if command -v pnpm >/dev/null 2>&1; then
              pnpm install --prod --frozen-lockfile
            fi

            # 2. Asegurar directorios persistentes del backend y archivo .env limpio
            mkdir -p /var/www/wilfrido_trujillo/backend/data
            mkdir -p /var/www/wilfrido_trujillo/backend/uploads

            if [ ! -f /var/www/wilfrido_trujillo/backend/.env ] || ! grep -q "^JWT_SECRET=" /var/www/wilfrido_trujillo/backend/.env || grep -q "200~" /var/www/wilfrido_trujillo/backend/.env; then
              GENERATED_SECRET=$(openssl rand -hex 32)
              cat << EOF > /var/www/wilfrido_trujillo/backend/.env
            PORT=3010
            NODE_ENV=production
            JWT_SECRET=${GENERATED_SECRET}
            JWT_EXPIRES_IN=7d
            DATABASE_PATH=./data/wilfrido.sqlite
            DB_SYNCHRONIZE=true
            UPLOAD_LOCATION=./uploads
            MAX_FILE_SIZE_MB=25
            APP_URL=https://wilfridotrujillo.doicela.dev
            CORS_ORIGIN=https://wilfridotrujillo.doicela.dev
            EOF
            fi

            # 3. Asegurar certificado SSL en el VPS para modo Full de Cloudflare (Puerto 443)
            if [ ! -f /etc/ssl/certs/nginx-selfsigned.crt ]; then
              sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /etc/ssl/private/nginx-selfsigned.key \
                -out /etc/ssl/certs/nginx-selfsigned.crt \
                -subj "/CN=wilfridotrujillo.doicela.dev"
            fi

            # 4. Escribir configuración de Nginx (Puertos 80 y 443 SSL)
            cat << 'EOF' | sudo tee /etc/nginx/sites-available/wilfridotrujillo.doicela.dev >/dev/null
            server {
                listen 80;
                listen 443 ssl;
                http2 on;
                server_name wilfridotrujillo.doicela.dev;

                server_tokens off;

                ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
                ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

                root /var/www/wilfrido_trujillo/frontend/dist;
                index index.html;

                client_max_body_size 25M;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://127.0.0.1:3010/api/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }

                location ~ /\. {
                    deny all;
                }
            }
            EOF

            sudo ln -sf /etc/nginx/sites-available/wilfridotrujillo.doicela.dev /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

            # 5. Escribir servicio Systemd limpio
            CURRENT_USER=$(whoami)
            cat << EOF | sudo tee /etc/systemd/system/wilfrido-backend.service >/dev/null
            [Unit]
            Description=Plataforma Wilfrido Trujillo - Backend NestJS
            After=network.target

            [Service]
            Type=simple
            User=${CURRENT_USER}
            WorkingDirectory=/var/www/wilfrido_trujillo/backend
            ExecStart=/usr/bin/node dist/main.js
            Restart=always
            RestartSec=5
            Environment=NODE_ENV=production
            LimitNOFILE=65535

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable wilfrido-backend
            sudo systemctl restart wilfrido-backend
            sleep 3
            if ! curl -s http://127.0.0.1:3010/api/workspaces >/dev/null; then
              sudo journalctl -u wilfrido-backend -n 40 --no-pager
              exit 1
            fi
            echo "Despliegue a https://wilfridotrujillo.doicela.dev completado y verificado exitosamente."

