name: CI/CD Pipeline (Build en GitHub & Despliegue en Debian)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, Test & Build en Servidores de GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configurar Node.js 22 LTS con caché
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias del monorepo
        run: pnpm install --frozen-lockfile

      - name: Análisis estático de código (Oxlint)
        run: pnpm -r run lint

      - name: Ejecutar pruebas unitarias (Vitest)
        run: pnpm --filter backend run test

      - name: Compilar monorepo para producción (Zero RAM en el VPS)
        run: pnpm -r run build
        env:
          VITE_API_URL: /api

      - name: Guardar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            backend/dist/
            frontend/dist/
            backend/package.json
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          retention-days: 7

  deploy:
    name: Despliegue Automatizado a VPS Debian
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validar disponibilidad de credenciales VPS
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secretos VPS_HOST o VPS_SSH_KEY no detectados en GitHub Secrets. Se omite el envío por SSH."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Credenciales VPS detectadas. Procediendo con el despliegue..."
          fi

      - name: Descargar artefactos compilados desde GitHub
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: Desplegar artefactos al servidor VPS vía SCP
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "backend/dist/,frontend/dist/,backend/package.json,package.json,pnpm-lock.yaml,pnpm-workspace.yaml"
          target: "/var/www/wilfrido_trujillo/"
          overwrite: true

      - name: Reiniciar servicios en el VPS vía SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /var/www/wilfrido_trujillo
            pnpm install --prod --frozen-lockfile
            sudo systemctl restart wilfrido-backend
            sudo systemctl reload nginx
            echo "Despliegue a https://wilfridotrujillo.doicela.dev completado exitosamente."

